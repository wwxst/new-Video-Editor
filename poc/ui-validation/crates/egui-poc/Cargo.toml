[package]
name = "egui-poc"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "egui-poc"
path = "src/main.rs"

[dependencies]
scene.workspace = true
serde_json.workspace = true
wgpu.workspace = true
pollster.workspace = true
egui = "0.37"
egui-wgpu = { version = "0.37", features = ["winit"] }
egui-winit = { version = "0.37", default-features = false, features = ["clipboard", "links"] }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }
bytemuck = { version = "1", features = ["derive"] }
