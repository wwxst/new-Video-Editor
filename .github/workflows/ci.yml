name: CI

# Windows/Linux/macOS CI (ADR-0011). The `core` job covers the FFmpeg-free crates on every OS; the
# `media` job builds the pinned FFmpeg 9.1 package from the in-repo recipe and runs the full suite.
# The media job is Windows-only because the shim is built with MinGW and the pinned package is a
# Windows cross-build.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Do not cancel a push-to-main run: its media job can spend up to an hour building FFmpeg, and a
# documentation commit should not throw that away. Superseded pull-request runs are cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  core:
    name: core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust 1.95 (declared MSRV)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: core-${{ matrix.os }}

      # arc-core, arc-audio and arc-render have no FFmpeg dependency (docs/01 §4), so they build and
      # test on every OS without the media package.
      - name: Build the FFmpeg-free crates
        run: cargo build -p arc-core -p arc-audio

      - name: Check the compositor crate
        run: cargo check -p arc-render

      - name: Test arc-core
        run: cargo test -p arc-core

      # The warning strategy is the repository's: clippy must exit 0, warnings are shown but not
      # denied (HANDOVER §1/§6.1).
      - name: Clippy
        run: cargo clippy -p arc-core -p arc-audio -p arc-render --all-targets

  media:
    name: media (Windows, pinned FFmpeg 9.1)
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: MSYS2 UCRT64 (FFmpeg build host + MinGW for the shim)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-dav1d
            mingw-w64-ucrt-x86_64-svt-av1
            mingw-w64-ucrt-x86_64-libvpl
            mingw-w64-ucrt-x86_64-ffnvcodec-headers
            mingw-w64-ucrt-x86_64-amf-headers
            mingw-w64-ucrt-x86_64-zlib
            make
            diffutils
            sed
            gawk
            xz
            tar
            git
            gnupg
            curl

      - name: Cache the pinned FFmpeg 9.1 package
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\.local\toolchains\ffmpeg-9.1-lgpl
          key: ffmpeg-9.1-lgpl-${{ hashFiles('third_party/ffmpeg/manifest.json', 'third_party/ffmpeg/configure-9.1.txt', 'third_party/ffmpeg/build.sh') }}

      # The recipe verifies the release signature and the pinned SHA-256 itself; these steps only
      # fetch the official artifacts. On a cache hit both steps are skipped.
      - name: Fetch the FFmpeg 9.1 source and signature
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          # MSYS2's HOME is /home/<user> (inside the MSYS2 root), but the package path the workflow
          # caches and passes as ARCLINE_FFMPEG_DIR is C:\Users\<user>\.local; align them.
          export HOME="$(cygpath "$USERPROFILE")"
          mkdir -p "$HOME/.local/toolchains/dl-ffmpeg"
          curl -fsSL -o "$HOME/.local/toolchains/dl-ffmpeg/ffmpeg-9.1.tar.xz" \
            https://ffmpeg.org/releases/ffmpeg-9.1.tar.xz
          curl -fsSL -o "$HOME/.local/toolchains/dl-ffmpeg/ffmpeg-9.1.tar.xz.asc" \
            https://ffmpeg.org/releases/ffmpeg-9.1.tar.xz.asc

      # ~20-40 min on a 4-core runner; later runs restore the cached package in seconds.
      - name: Build the pinned FFmpeg 9.1 (LGPL 2.1+)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          # build.sh installs to $HOME/.local/toolchains/ffmpeg-9.1-lgpl; MSYS2's default HOME is
          # inside the MSYS2 root, so without this the package lands where the cache/ARCLINE_FFMPEG_DIR
          # cannot see it (the arc-media build script then finds no headers).
          export HOME="$(cygpath "$USERPROFILE")"
          cd "$(cygpath "$GITHUB_WORKSPACE")"
          bash third_party/ffmpeg/build.sh

      # Save immediately after a successful build: the automatic post-job save is skipped when a
      # later step fails, which would make every trial run rebuild FFmpeg for ~25 minutes.
      - name: Save the FFmpeg package cache
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:\Users\runneradmin\.local\toolchains\ffmpeg-9.1-lgpl
          key: ffmpeg-9.1-lgpl-${{ hashFiles('third_party/ffmpeg/manifest.json', 'third_party/ffmpeg/configure-9.1.txt', 'third_party/ffmpeg/build.sh') }}

      - name: Rust 1.95 (x86_64-pc-windows-gnu host)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0-x86_64-pc-windows-gnu
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: media-windows

      # Separate steps so a red run says which one failed (job logs need repository admin rights,
      # so the step name is the first-line diagnostic).
      - name: Build the whole workspace
        shell: pwsh
        env:
          ARCLINE_FFMPEG_DIR: C:\Users\runneradmin\.local\toolchains\ffmpeg-9.1-lgpl
          ARCLINE_FORCE_FALLBACK_ADAPTER: "1"
        run: |
          $env:PATH = "C:\msys64\ucrt64\bin;$env:ARCLINE_FFMPEG_DIR\bin;$env:PATH"
          $log = Join-Path $env:RUNNER_TEMP 'build.log'
          cargo build --workspace --all-targets 2>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $lines = Get-Content $log
            # One annotation with the first error and its 40-line context (the build-script stderr
            # block), because job logs need admin rights but annotations are readable.
            $hit = $lines | Select-String -Pattern 'error\[|error:|failed to run custom build|Caused by' | Select-Object -First 1
            if ($hit) {
              $start = [Math]::Max(0, $hit[0].LineNumber - 1)
              $end = [Math]::Min($lines.Count - 1, $start + 40)
              $ctx = ($lines[$start..$end] | ForEach-Object { $_.TrimEnd() } | Where-Object { $_ }) -join "`n"
              $msg = ($ctx -replace '%', '%25') -replace "`r?`n", '%0A'
              Write-Output "::error title=cargo build context::$msg"
            }
            $tail = ($lines | Select-Object -Last 80) -join "`n"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### cargo build failed`n``````text`n$tail`n``````"
            exit $code
          }

      - name: Test the whole workspace
        shell: pwsh
        env:
          ARCLINE_FFMPEG_DIR: C:\Users\runneradmin\.local\toolchains\ffmpeg-9.1-lgpl
          # GitHub Windows runners have no GPU: the compositor tests use the software adapter
          # (HANDOVER §6.3). Hardware-encoder assertions skip themselves when no encoder exists.
          ARCLINE_FORCE_FALLBACK_ADAPTER: "1"
          RUST_BACKTRACE: "1"
        run: |
          $env:PATH = "C:\msys64\ucrt64\bin;$env:ARCLINE_FFMPEG_DIR\bin;$env:PATH"
          $log = Join-Path $env:RUNNER_TEMP 'test.log'
          cargo test --workspace --no-fail-fast 2>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $lines = Get-Content $log
            $hit = $lines | Select-String -Pattern 'FAILED|panicked at|STATUS_|error\[|test result: FAILED' | Select-Object -First 1
            if ($hit) {
              $start = [Math]::Max(0, $hit[0].LineNumber - 1)
              $end = [Math]::Min($lines.Count - 1, $start + 60)
              $ctx = ($lines[$start..$end] | ForEach-Object { $_.TrimEnd() } | Where-Object { $_ }) -join "`n"
              $msg = ($ctx -replace '%', '%25') -replace "`r?`n", '%0A'
              Write-Output "::error title=cargo test context::$msg"
            }
            $tail = ($lines | Select-Object -Last 80) -join "`n"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### cargo test failed`n``````text`n$tail`n``````"
            exit $code
          }

      - name: Clippy
        shell: pwsh
        env:
          ARCLINE_FFMPEG_DIR: C:\Users\runneradmin\.local\toolchains\ffmpeg-9.1-lgpl
        run: |
          $env:PATH = "C:\msys64\ucrt64\bin;$env:ARCLINE_FFMPEG_DIR\bin;$env:PATH"
          $log = Join-Path $env:RUNNER_TEMP 'clippy.log'
          cargo clippy --workspace --all-targets 2>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $lines = Get-Content $log
            $hits = $lines | Select-String -Pattern 'error\[|error:' | Select-Object -First 25
            foreach ($h in $hits) {
              $msg = ($h.Line.Trim() -replace '%', '%%') -replace "`r?`n", ' '
              Write-Output "::error title=cargo clippy:: $msg"
            }
            $tail = ($lines | Select-Object -Last 60) -join "`n"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### cargo clippy failed`n``````text`n$tail`n``````"
            exit $code
          }
