[package]
name = "slint-poc"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "slint-poc"
path = "src/main.rs"

# FemtoVG on wgpu 30 is the renderer this validation measures. It is the only renderer that builds
# with the machine's windows-gnu toolchain; Skia needs a prebuilt MSVC artifact.
[features]
default = []
skia = ["slint/renderer-skia"]

[dependencies]
scene.workspace = true
serde_json.workspace = true
wgpu.workspace = true
pollster.workspace = true
bytemuck = { version = "1", features = ["derive"] }
png = "0.18"
raw-window-handle = "0.6"
slint = { version = "1.19.1", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-femtovg-wgpu",
    "renderer-software",
    "compat-1-2",
    "unstable-wgpu-30",
    "unstable-winit-030",
] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "1.19.1"
