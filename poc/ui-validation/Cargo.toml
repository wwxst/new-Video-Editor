[workspace]
resolver = "3"
members = ["crates/scene", "crates/egui-poc", "crates/slint-poc"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
scene = { path = "crates/scene" }
wgpu = "30.0.2"
pollster = "0.4"
serde_json = "1"

# Release-grade codegen matters for every number in the report.
[profile.release]
opt-level = 3
lto = "thin"
